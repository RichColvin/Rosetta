[DISPLAY]

# Stuff needed to stop errors in Glade
ANGULAR_INCREMENTS       = 1, 5, 15, 45, 90

DEFAULT_SPINDLE_0_SPEED  = 5
DEFAULT_SPINDLE_1_SPEED  = 5

MIN_SPINDLE_0_SPEED      = 0
MIN_SPINDLE_1_SPEED      = 0

MAX_SPINDLE_0_SPEED      = 10
MAX_SPINDLE_1_SPEED      = 100

MAX_SPINDLE_0_OVERRIDE   = 1.000000
MAX_SPINDLE_1_OVERRIDE   = 1.000000

MIN_SPINDLE_0_OVERRIDE   = 0.001
MIN_SPINDLE_1_OVERRIDE   = 0.001

LATHE                    = 1

# Cycle time of the display GUI. Depending on the screen, this can be in
# seconds or ms (ms preferred). This is often the update rate rather then
# sleep time between updates. If the update time is not set right the
# screen can become unresponsive or very jerky. A value of 100 ms (0.1 s)
# is a common setting though a range of 50 - 200 ms (.05 - .2 s) may be
# useable. An under powered CPU may see improvement with a longer
# setting. Usually the default is fine.
CYCLE_TIME               = 100

# The file name of the executable providing the user interface to use.
DISPLAY                  = axis
EDITOR                   = gedit
# ********************************************************************
# This is for the Rosetta panels shown as tabs
#

EMBED_TAB_NAME           = ℛ Help
EMBED_TAB_COMMAND        = halcmd loadusr -Wn RosettaHlp gladevcp -c RosettaHlp -u Rosetta_Display/Rosetta_main.py -x {XID} Rosetta_Display/Rosetta_Tab_Help_v1.ui

EMBED_TAB_NAME           = ℛ License
EMBED_TAB_COMMAND        = halcmd loadusr -Wn RosettaUsg gladevcp -c RosettaUsg -u Rosetta_Display/Rosetta_main.py -x {XID} Rosetta_Display/Rosetta_Tab_TsCs_v1.ui
# ********************************************************************
# Shipped-default value only, generated fresh each launch from
# whatever the operator has assigned via the Axis Selection tab (any
# of X,Z,U,V,W,A,B,C,Sp0,Sp1 - 8 of the 10 - to any of the 8 physical
# channels) - see the note above [KINS] for the full explanation.
GEOMETRY                 = XZBUVW

# AXIS's built-in startup backplot (axis-lathe.ngc, shown automatically
# when LATHE=1 and OPEN_FILE is unset) hardcodes X/Z moves and errors
# out whenever X isn't one of the currently-active axis letters (Axis
# Selection tab). Rosetta_Splash.ngc has no axis words, so it loads
# regardless of the current channel assignment.
OPEN_FILE                = Rosetta_Display/Rosetta_Splash.ngc
# ********************************************************************
# This is for the Rosetta panel shown on the right side of the screen
GLADEVCP                 = -u Rosetta_Display/Rosetta_main.py Rosetta_Display/Rosetta_Panel_v1.ui
# ********************************************************************

# Increments available for incremental jogs. 
INCREMENTS               = .1in .05in .01in .005in .001in .0005in .0001in

INTRO_GRAPHIC            = RosettaStartupImage.gif
INTRO_TIME               = 10

# The coordinate system (RELATIVE or MACHINE) to show on the DRO 
# when the user interface starts. The RELATIVE coordinate system
# reflects the G92 and G5x coordinate offsets currently in effect.
POSITION_OFFSET          = RELATIVE

# The coordinate value (COMMANDED or ACTUAL) to show on the DRO
# when the user interface starts.
POSITION_FEEDBACK        = COMMANDED

# The maximum feed override the user may select. 2 means 200%
# of the programmed feed rate.
MAX_FEED_OVERRIDE        = 2.000000

# DEFAULT/MAX/MIN_ANGULAR_VELOCITY and DEFAULT/MIN_LINEAR_VELOCITY below
# (and their [TRAJ] counterparts further down) are historical starting
# values only - the live, user-editable values are on the Rosetta Settings
# program's Other tab, persisted in ~/Documents/RosettaSet_v1.ini,
# and overlaid onto Rosetta.local.ini at every LinuxCNC launch (see
# Rosetta_Setup/Rosetta_Generate_Local_Ini.py) - same mechanism as
# MAX_LINEAR_VELOCITY/Max Jog Speed just below. A LinuxCNC restart is
# required for a change to take effect (these are read once at process
# startup, unlike stepgen scale/PID/backlash which are live HAL pins).

# The default velocity for angular jogs, in machine units per second.
DEFAULT_ANGULAR_VELOCITY = 5.8333
# Maximum velocity for angular jogs, in machine units per second.
MAX_ANGULAR_VELOCITY     = 10.0000
# Approximate lowest value the angular jog slider.
MIN_ANGULAR_VELOCITY     = 1.6667

# The default velocity for linear jogs, in machine units per second.
DEFAULT_LINEAR_VELOCITY  = 0.2500
# Maximum velocity for linear jogs, in machine units per second.
MAX_LINEAR_VELOCITY      = 0.3000
# Approximate lowest value the jog slider.
MIN_LINEAR_VELOCITY      = 0.0167

# The maximum spindle override the user may select. 1.0 means
# 100% of the programmed spindle speed.
MAX_SPINDLE_OVERRIDE     = 1.0000
# The minimum spindle override the user may select. 0.001
# means 1% of the programmed spindle speed.
MIN_SPINDLE_OVERRIDE     = 0.001

#  The approximate lowest value the jog slider.
MIN_VELOCITY             = 0.01

# Timeout (in seconds) for loading graphical preview of G-code. 
# Currently AXIS only.
PREVIEW_TIMEOUT          = 10

# The default directory for G-code files, named subroutines, and
# user-defined M-codes. The PROGRAM_PREFIX directory is searched
# before the directories listed in [RS274]SUBROUTINE_PATH and
# [RS274]USER_M_PATH. It is also the folder AXIS's Open dialog starts
# in - the repo's gcode folder since 20 October 2026 (was
# ~/linuxcnc/nc_files, which most Rosetta machines don't have).
# Relative to the repo: Rosetta_Generate_Local_Ini.py writes this machine's
# full path into Rosetta.local.ini (_overlay_repo_paths).
PROGRAM_PREFIX           = gcode

# The editor to use when editing the tool table 
TOOL_EDITOR              = tooledit

# ********************************************************************
#
# EEEEEEEE MM    MM  CCCCCC
# EE       MMM  MMM CC    CC
# EE       MM MM MM CC

# 
# HH    HH    AA    LL       
# HH    HH   AAAA   LL             
# HHHHHHHH  AA  AA  LL             
# HH    HH AAAAAAAA LL             
# HH    HH AA    AA LL             
# HH    HH AA    AA LLLLLLLL 

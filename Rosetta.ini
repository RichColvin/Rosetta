[HAL]
# Add the HAL user interface pins.
HALUI                    = halui

HALFILE                  = Rosetta.hal
HALFILE                  = Rosetta_Custom/Rosetta_Custom.hal
POSTGUI_HALFILE          = Rosetta_Display/Rosetta_PostGUI_v1.hal
# Full path written into Rosetta.local.ini at launch (_overlay_repo_paths).
SHUTDOWN                 = Rosetta_Shutdown.hal

# ********************************************************************
# 
# KK    KK IIIIIIII N     NN  SSSSSS
# KK   KK     II    NN    NN SS    SS
# KK  KK      II    NNN   NN  SSS
# KKKK        II    NN NN NN     SSS
# KK  KKK     II    NN  NNNN SS    SS
# KK   KKK IIIIIIII NN    NN  SSSSSS
#
# ********************************************************************
[KINS]
# JOINTS/KINEMATICS' coordinates=, [TRAJ]COORDINATES/SPINDLES and
# [DISPLAY]GEOMETRY below are all shipped-default
# values only, for the shipped CHANNEL_DEFAULT_ROLE assignment
# (rosetta_settings_io.py) - Rosetta_Setup/Rosetta_Generate_Local_Ini.py
# recomputes and overlays all of these into Rosetta.local.ini at every
# launch from whatever the operator has actually assigned via the
# Axis Selection tab (any of X,Z,U,V,W,A,B,C,Sp0,Sp1 - 8 of the 10 -
# to any of the 8 physical channels; the other 2 are simply not part
# of that launch's JOINTS/SPINDLES at all). Never edit these directly
# expecting a persistent effect - see CLAUDE.md.
#
# the number of joints (motors) in the system.
JOINTS                   = 6

# Specify a kinematics module for the motion module
KINEMATICS               = trivkins coordinates=XZBUVW

# ********************************************************************
# 
# RRRRRRR   SSSSSS   222222  77777777   44 N     NN  CCCCCC
# RR    RR SS    SS 22    22     77    444 NN    NN CC    CC
# RRRRRRR   SSS          22     77   44 44 NNN   NN CC    
# RR   RR      SSS     22      77   44  44 NN NN NN CC    
# RR    RR SS    SS  22       77  44444444 NN  NNNN CC    CC
# RR    RR  SSSSSS  22222222 77         44 NN    NN  CCCCCC
#
# ********************************************************************
[RS274NGC]
# The file located in the same directory as the INI file which contains
# the parameters used by the interpreter (saved between runs).
PARAMETER_FILE           = sim.var

######################## RS274NGC_STARTUP_CODE #######################
# A string of NC codes that the interpreter is initialized with. This is 
# not a substitute for specifying modal G-codes at the top of each NGC 
# file, because the modal codes of machines differ, and may be changed
# by G-code interpreted earlier in the session.
#
# Units to use -------------------------------------------------------
# G20 - use inches for length units.
# G21 - use millimeters for length units.
#
# Cutter compensation ------------------------------------------------
# G40 - turn cutter compensation off.
# G41 <D-> (left of programmed path)
# G42 <D-> (right of programmed path)
#
# Distance mode -------------------------------------------------------
# G90 - absolute distance mode In absolute distance mode, axis numbers
#    (X, Y, Z, A, B, C, U, V, W) usually represent positions in terms
#    of the currently active coordinate system. Any exceptions to that
#    rule are described explicitly in the G80 G89 section.
# G91 - incremental distance mode In incremental distance mode, axis
#    numbers usually represent increments from the current coordinate.
#
# Feed rate mode ------------------------------------------------------
# G93 - is Inverse Time Mode. In inverse time feed rate mode, an F word
#    means the move should be completed in [one divided by the F
#    number] minutes. For example, if the F number is 2.0, the move
#    should be completed in half a minute.
#    When the inverse time feed rate mode is active, an F word must
#    appear on every line which has a G1, G2, or G3 motion, and an
#    F-word on a line that does not have G1, G2, or G3 is ignored. 
#    Being in inverse time feed rate mode does not affect G0 (rapid
#    move) motions.
# G94 - is Units per Minute Mode. In units per minute feed mode, an F
#    word is interpreted to mean the controlled point should move at a
#    certain number of inches per minute, millimeters per minute, or
#    degrees per minute, depending upon what length units are being
#    used and which axis or axes are moving.
# G95 - is Units per Revolution Mode In units per revolution mode, an
#    F-word is interpreted to mean the controlled point should move a
#    certain number of inches per revolution of the spindle, depending
#    on what length units are being used and which axis or axes are
#    moving. G95 is not suitable for threading, for threading use G33
#    or G76. G95 requires that spindle.N.speed-in to be connected. The
#    actual spindle to which the feed is synchronised is chosen by the
#    $ parameter.
#
# Spindle control mode ------------------------------------------------
# G96 <D-> S- <$-> (Constant Surface Speed Mode)
# G97 S- <$-> (RPM Mode)
#
# G64 Path Blending ---------------------------------------------------
# G64 <P- <Q->>
#    P - motion blending tolerance
#    Q - naive cam tolerance 
#
RS274NGC_STARTUP_CODE    = G20 G40 G91 G94 G97 G64 P0.001

# Specifies a colon (:) separated list of up to 10 directories to be 
# searched when single-file subroutines are specified in G-code. These
# directories are searched after searching [DISPLAY]PROGRAM_PREFIX (if
# it is specified) and before searching [WIZARD]WIZARD_ROOT (if
# specified). Rosetta_Subroutines holds the subroutines Rosetta_main.py calls
# from MDI (rosetta_thread.ngc for the main panel's Threading tab). Relative
# paths resolve against the configuration directory, the same as
# Rosetta.hal's own.
SUBROUTINE_PATH          = ../../nc_files/gladevcp_lib:Rosetta_Subroutines

# ********************************************************************
# 
# TTTTTTTT   AA     SSSSSS  KK    KK
#    TT     AAAA   SS    SS KK   KK
#    TT    AA  AA    SSS    KK  KK
#    TT   AAAAAAAA     SSS  KKKK
#    TT   AA    AA SS    SS KK KKK
#    TT   AA    AA SSSSSS   KK   KKK
#
# ********************************************************************
[TASK]

# The period, in seconds, at which TASK will run.
CYCLE_TIME               = 0.010

# Specifies the name of the task executable. The task executable does
# various things, such as
#    - communicate with the UIs over NML,
#    - communicate with the realtime motion planner over non-HAL shared
#       memory, and
#    - interpret G-code. Currently there is only one task executable 
#      that makes sense for 99.9% of users, milltask.
TASK                     = milltask

# ********************************************************************
# 
# TTTTTTTT RRRRRRR     AA          JJ
#    TT    RR     RR  AAAA         JJ
#    TT    RRRRRRR   AA  AA        JJ
#    TT    RR    RR AAAAAAAA       JJ
#    TT    RR    RR AA    AA JJ    JJ
#    TT    RR    RR AA    AA  JJJJJJ
#
# ********************************************************************
[TRAJ]

# Specifies the machine units for rotational axes.  Can be
# deg, degree (360/circle), rad, radian (2*π/circle), grad, or 
# gon (400/circle)
ANGULAR_UNITS            = degree

# Specifies the machine units for linear axes. Can be inch or mm.
LINEAR_UNITS             = inch

# The names of the axes being controlled.
# Shipped-default value only, generated fresh each launch - see the
# note above [KINS] above.
COORDINATES              = XZBUVW

# The initial rate for jogs of angular axes, in machine units per second.
# Historical value only - see the Rosetta Settings program's Other tab / the
# note above [DISPLAY]'s copy of this key.
DEFAULT_ANGULAR_VELOCITY = 5.8333

# The initial rate for jogs of linear axes, in machine units per second.
# Historical value only - see the Settings tab's General tab / the note
# above [DISPLAY]'s copy of this key.
DEFAULT_LINEAR_VELOCITY  = 0.2500

# The maximum velocity for angular axes, in machine units per second.
# Historical value only - see the Settings tab's General tab / the note
# above [DISPLAY]'s copy of this key.
MAX_ANGULAR_VELOCITY     = 36000.00

# The maximum velocity for any axis or coordinated move, in machine
# units per second. 
MAX_LINEAR_VELOCITY      = 0.3000

# The default behavior is for LinuxCNC to force the user to home the
# machine before any MDI command or a program is run. Normally, only
# jogging is allowed before homing. For configurations using identity
# kinematics, setting NO_FORCE_HOMING = 1 allows the user to make MDI
# moves and run programs without homing the machine first. Interfaces
# using identity kinematics without homing ability will need to have
# this option set to 1.
# LinuxCNC will not know your joint travel limits when using 
# NO_FORCE_HOMING = 1.
NO_FORCE_HOMING          = 1

# The number of spindles to support. It is imperative that
# this number matches the ”num_spindles” parameter passed to
# the motion module.
# Shipped-default value only, generated fresh each launch (0-2,
# depending how many of Sp0/Sp1 are currently assigned to a channel) -
# see the note above [KINS].
SPINDLES                 = 2
# ******************************************

# ********************************************************************
# SPEED AND ACCELERATION LIMITS ARE SET IN Rosetta SETTINGS
#
# Since 08 October 2026 each machine's own limits are on Rosetta Settings'
# Axis and Stepper Motor Tuning page and saved in RosettaSet_v1.ini, so a
# software update can't change them. The values in the sections below
# are starting values only:
#   MAX_VELOCITY / MAX_ACCELERATION ([AXIS_*] and [JOINT_n])
#       -> Max Speed / Max Acceleration. Rosetta_Setup/Rosetta_Generate_Local_Ini.py
#          writes the machine's own values into Rosetta.local.ini at launch.
#   STEPGEN_MAXVEL / STEPGEN_MAXACCEL -> Stepgen Max Vel / Max Accel
#   MAX_OUTPUT                        -> PID Max Output
#   [SPINDLE_n] MAX_OUTPUT_POS        -> Indexing Max Output
#       Rosetta_Display/Rosetta_Settings_Restore.py sets these three at startup.
# Linear axes are capped at 1 in/sec (25.4 mm/sec).
# ********************************************************************

# ********************************************************************
#    AA    XX    XX IIIIIIII  SSSSSS      YY    YY
#   AAAA    XX  XX    II     SS    SS      YY  YY
#  AA  AA    XXXX     II      SSS           YYYY
# AAAAAAAA   XXXX     II         SSS        XXXX
# AA    AA  XX  XX    II     SS    SS      XX   XX
# AA    AA XX    XX IIIIIIII  SSSSSS      XX     XX
# ********************************************************************

# ********************************************************************
# Configuration values
#                                 Home   PCB
#  Axis  Joint  Channel   Type     Seq  Plug  Comments
#  ----  -----  -------  -------  ----  ----  ------------------------
#   X      0       04    LINEAR     1    P15
# ********************************************************************

[AXIS_X]
# *******************
TYPE                 = LINEAR

# Linear axes are capped at 1 in/sec (was 10).
MAX_VELOCITY         = 1.0
MAX_ACCELERATION     = 20.0

MIN_LIMIT            = -1e99
MAX_LIMIT            = 1e99

[JOINT_0]
TYPE                 = LINEAR
UNITS                = INCH

MAX_VELOCITY         = 1.0
MAX_ACCELERATION     = 20.0

# ********************************************************************
# STEPPER MOTOR SETTINGS
#

# Was 0.5 - lower than MAX_ACCELERATION (20.0) above, backwards from
# normal practice (stepgen limits should exceed trajectory limits with
# margin, same as STEPGEN_MAXVEL vs MAX_VELOCITY below). This let the
# trajectory planner demand more acceleration than the stepgen could
# ever deliver, producing a large following error at the start of every
# move that a P=35 loop then fought hard to correct, overshooting into
# oscillation. Raised to 1.5x MAX_ACCELERATION as a conservative
# starting point - retest live and retune from here.
STEPGEN_MAXACCEL     = 30

# Was 0.95, set when this axis's live <scale> (see
# ~/Documents/RosettaSet_v1.ini) was ~195900 steps/in. The scale
# has since roughly doubled to 387650 steps/in, and with
# STEPLEN+STEPSPACE = 5000ns/step the hardware ceiling is 1/5000ns =
# 200,000 steps/sec = ~0.516 in/sec - well below 0.95, so it was
# silently clipping again (see the "maxvel is too big" warning).
# Rich wants a working max speed of ~10 in/min = 0.1667 in/sec; set to
# 0.4 in/sec for comfortable margin above that target and below the
# ~0.516 in/sec ceiling.
STEPGEN_MAXVEL       = 0.4

# ********************************************************************
# STANDARD VALUES
#
# These parameters are best left alone

# Starting value only - Rosetta_Generate_Local_Ini.py writes each axis's
# Backlash from Rosetta Settings (RosettaSet_v1.ini) into Rosetta.local.ini.
BACKLASH             = 0.0000

MIN_LIMIT            = -1e99
MAX_LIMIT            = 1e99

MIN_FERROR           = 10
FERROR               = 100

HOME                 = 0.0
HOME_SEQUENCE        = 1

BIAS                 = 0.0
DEADBAND             = 0.00005
MAX_OUTPUT           = 10.0

# For the StepperOnline DM542T Digital Stepper Drive 
# These are 5 μs = 5,000 ns
DIRHOLD              = 5000
DIRSETUP             = 5000
# These are 2.5 μs = 2,500 ns
STEPLEN              = 2500
STEPSPACE            = 2500
# ********************************************************************

# ******************************************
#                                 Home
#  Axis  Joint  Channel   Type     Seq
#  ----  -----  -------  -------  ----
#   Y      NA      NA      NA      NA
#
# with LATHE=1, the Y axis is not used.

# ********************************************************************
#    AA    XX    XX IIIIIIII  SSSSSS      ZZZZZZZZ
#   AAAA    XX  XX    II     SS    SS          ZZ
#  AA  AA    XXXX     II      SSS             ZZ
# AAAAAAAA   XXXX     II         SSS        ZZ
# AA    AA  XX  XX    II     SS    SS      ZZ
# AA    AA XX    XX IIIIIIII  SSSSSS      ZZZZZZZZ
# ********************************************************************

# ********************************************************************
# Configuration values
#                                 Home   PCB
#  Axis  Joint  Channel   Type     Seq  Plug  Comments
#  ----  -----  -------  -------  ----  ----  ------------------------
#   Z      1       01    LINEAR     2    P12
# ********************************************************************

[AXIS_Z]

# Computerized Ornamental Lathe
# Copyright 2014 Studio of Bill Ooms

# General note: Comments can either be preceded with a # or ; - either is
# acceptable, although # is in keeping with most linux config files.

# General section -------------------------------------------------------------
[EMC]

# Version of this INI file
VERSION = $Revision: 1.0$

# Name of machine, for use with display, etc.
MACHINE = COrnLathe

# Debug level, 0 means no messages. See src/emc/nml_int/emcglb.h for others
# DEBUG = 0x7FFFFFFF
DEBUG = 0

# Name of NML file to use, default is emc.nml
NML_FILE = linuxcnc.nml

# Sections for display options ------------------------------------------------
[DISPLAY]

# Name of display program, e.g., xemc
DISPLAY = axis
LATHE = 1
EDITOR = gedit

# Cycle time, in seconds, that display will sleep between polls
CYCLE_TIME = 0.100

# Path to help file
HELP_FILE = doc/help.txt

# Initial display setting for position, RELATIVE or MACHINE
POSITION_OFFSET = RELATIVE

# Initial display setting for position, COMMANDED or ACTUAL
POSITION_FEEDBACK = ACTUAL

# Highest value that will be allowed for feed override, 1.0 = 100%
MAX_FEED_OVERRIDE = 1.2

# Prefix to be used
PROGRAM_PREFIX = ~/linuxcnc/nc_files
OPEN_FILE = /home/bill/linuxcnc/nc_files/LoadMe.ngc

# Introductory graphic
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 2

USER_COMMAND_FILE = ~/.axisrc

INCREMENTS = .1in .01in .001in .0001in

[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Grayscale Depth Image
PROGRAM_EXTENSION = .py Python Script

png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python

# Task controller section -----------------------------------------------------
[TASK]

# Name of task controller program, e.g., milltask
TASK = milltask

# Cycle time, in seconds, that task controller will sleep between polls
CYCLE_TIME = 0.001

# Part program interpreter section --------------------------------------------
[RS274NGC]

# File containing interpreter variables
PARAMETER_FILE = COrnLathe.var

# Motion control section ------------------------------------------------------
[EMCMOT]

EMCMOT = motmod

# Timeout for comm to emcmot, in seconds
COMM_TIMEOUT = 1.0

# Interval between tries to emcmot, in seconds
COMM_WAIT = 0.010

# Base task period, in nano-seconds - this is the fastest thread in the machine
BASE_PERIOD = 50000
# Servo task period, in nano-seconds - will be rounded to an integer multiple
#   of BASE_PERIOD
SERVO_PERIOD = 1000000

# Hardware Abstraction Layer section --------------------------------------------------
[HAL]

# The run script first uses halcmd to execute any HALFILE
# files, and then to execute any individual HALCMD commands.

# list of hal config files to run through halcmd
# files are executed in the order in which they appear
HALFILE = COrnLathe.hal
HALFILE = custom.hal

# Single file that is executed after the GUI has started.  Only supported by
# AXIS at this time (only AXIS creates a HAL component of its own)
POSTGUI_HALFILE = COrnLathe_postgui.hal

HALUI = halui

# MDI commands that can be executed by the user interface ---------------------
[HALUI]
MDI_COMMAND = G92.1
MDI_COMMAND = G0 C0.000
MDI_COMMAND = T1 M6 G43
MDI_COMMAND = T2 M6 G43
MDI_COMMAND = T3 M6 G43
MDI_COMMAND = G0 X0 Z0 C0

# Trajectory planner section --------------------------------------------------
[TRAJ]
AXES = 6
COORDINATES = X Z C
LINEAR_UNITS = inch
ANGULAR_UNITS = degree
CYCLE_TIME = 0.010
MAX_ANGULAR_VELOCITY = 60.00
DEFAULT_ANGULAR_VELOCITY = 6.00
DEFAULT_VELOCITY = 0.10
MAX_LINEAR_VELOCITY = 0.25
# Uncomment if you dont want it to force you to HOME each axis
#NO_FORCE_HOMING = 1
#POSITION_FILE = position.txt

# Axes sections ---------------------------------------------------------------

[AXIS_0]
TYPE = LINEAR
HOME = 0.0
# 15in/min / 60sec/min = 0.25in/sec
MAX_VELOCITY = 0.25
#MAX_ACCELERATION = 20.0	
#STEPGEN_MAXACCEL = 25.0
# 5X safety
MAX_ACCELERATION = 70.0
STEPGEN_MAXACCEL = 80.0
# 200steps/turn * 10usteps/step * 10tpi = 20000usteps/in
SCALE = 20000.0
FERROR = 0.05
MIN_FERROR = 0.01
MIN_LIMIT = -6.0
MAX_LIMIT = 6.0
HOME_OFFSET = 0.0

[AXIS_2]
TYPE = LINEAR
HOME = 0.0
# 15in/min / 60sec/min = 0.25in/sec
MAX_VELOCITY = 0.25
#MAX_ACCELERATION = 20.0	
#STEPGEN_MAXACCEL = 25.0
# 5X safety
MAX_ACCELERATION = 70.0
STEPGEN_MAXACCEL = 80.0
# 200steps/turn * 10usteps/step * 10tpi = 20000usteps/in
SCALE = 20000.0
FERROR = 0.05
MIN_FERROR = 0.01
MIN_LIMIT = -6.0
MAX_LIMIT = 6.0
HOME_OFFSET = 0.0

[AXIS_5]
TYPE = ANGULAR
HOME = 0.0
#WRAPPED_ROTARY = 1
#WRAPPED = 1
# 10rpm * 360deg/rot / 60sec/min = 60deg/sec
MAX_VELOCITY = 60.0
#MAX_ACCELERATION = 1000.0
#STEPGEN_MAXACCEL = 1250.0
# 5X safety
MAX_ACCELERATION = 22000.0
STEPGEN_MAXACCEL = 25000.0
# 200steps/turn * 10usteps/step * 6.5ratio / 360deg/rot = 36.1111111111usteps/deg
SCALE = 36.1111111111
FERROR = 1
MIN_FERROR = .25
#MIN_LIMIT = -10000000.0
#MAX_LIMIT = 10000000.0
HOME_OFFSET = 0.0

# section for main IO controller parameters -----------------------------------
[EMCIO]

# Name of IO controller program, e.g., io
EMCIO = io

# cycle time, in seconds
CYCLE_TIME = 0.100

# tool table file
TOOL_TABLE = COrnLathe.tbl

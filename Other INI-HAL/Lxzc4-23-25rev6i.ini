[EMC]
# The version string for this INI file.
VERSION = 1.1

MACHINE = Lxzc4-23-25rev6i
DEBUG = 0

[DISPLAY]
DISPLAY = axis
OPEN_FILE = /home/roy/linuxcnc/axisxzc.ngc/
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.000000
MAX_SPINDLE_OVERRIDE = 2.000000
MIN_SPINDLE_OVERRIDE = 1.00000
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 10.0

PROGRAM_PREFIX = /home/roy/linuxcnc/nc_files
INCREMENTS = .1in .05in .01in .005in .001in .0005in .0001in
POSITION_FEEDBACK = ACTUAL
DEFAULT_LINEAR_VELOCITY = 6.0
MAX_LINEAR_VELOCITY = 8.0
MIN_LINEAR_VELOCITY = 0.5
#  Angular velocities in machine units per second
DEFAULT_ANGULAR_VELOCITY = 2000.0
MAX_ANGULAR_VELOCITY = 2400.0
MIN_ANGULAR_VELOCITY = 0.5
DRO_FORMAT_IN = %4.4f
EDITOR = gedit
GEOMETRY = xzc

[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
PROGRAM_EXTENSION = .py Python Script
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python

[RS274NGC]

PARAMETER_FILE = linuxcnc.var
RS274NGC_STARTUP_CODE = G20 G54 G90 G94 G40 G18 G49 G80
# RS274NGC_STARTUP_CODE = G0 G1 G4 G18 G20 G40 G49 G54 G80 G90 G94 

[EMCMOT]

EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 50000
SERVO_PERIOD = 1000000
TRAJ_PERIOD = 100000

[TASK]
TASK = milltask
CYCLE_TIME = 0.01

# [HOSTMOT2]

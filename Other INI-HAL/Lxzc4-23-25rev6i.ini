# DRIVER0=hm2_pci
# BOARD0=5i25

[HAL]
HALUI = halui
HALFILE = Lxzc4-23-25rev6i.hal
HALFILE = custom.hal
POSTGUI_HALFILE = postgui_call_list.hal
SHUTDOWN = shutdown.hal

[HALUI]

[TRAJ]
COORDINATES = XZC
JOINTS = 3
MAX_ANGULAR_VELOCITY = 4000
DEFAULT_ANGULAR_VELOCITY = 2700.0
LINEAR_UNITS = inch
# linear units are machine units
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 6.0
MAX_LINEAR_VELOCITY = 8.0
# Velocities are in machine units
ARC_BLEND_ENABLE = 1
NO_FORCE_HOMING = 1

[EMCIO]
